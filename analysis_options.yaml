include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "apps/game/lib/l10n/gen/**"
    - "**/build/**"
  errors:
    # 문서 주석은 공개 계약(contracts.dart)에만 강제한다.
    public_member_api_docs: ignore

linter:
  rules:
    lines_longer_than_80_chars: false
    # 포트는 메서드 하나짜리 인터페이스여도 클래스로 둔다(가짜 구현 교체).
    one_member_abstracts: false

formatter:
  page_width: 120
