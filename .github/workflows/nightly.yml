name: nightly-balance

# 매일 밤 가상 플레이어 100명 × 30일 밸런스 리포트 + 선원 파워 예산 검사 (docs/GAME_DESIGN.md 4.8, 6.4).
# game_cli sim / balance가 구현되기 전(M1)에는 “미구현” 종료 코드 2를 건너뜀으로 처리한다.
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - name: 밸런스 시뮬 (100명 × 30일)
        run: |
          set +e
          dart run game_cli sim --players 100 --hours 720 --out reports/balance.json
          code=$?
          if [ $code -eq 2 ]; then echo "::notice::game_cli sim 미구현 — 건너뜀 (economy 레인 M1)"; exit 0; fi
          exit $code
      - name: 선원 파워 예산 (±10%)
        run: |
          set +e
          dart run game_cli balance crews
          code=$?
          if [ $code -eq 2 ]; then echo "::notice::balance crews 미구현 — 건너뜀"; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: reports/
          if-no-files-found: ignore
