name: ci

on:
  push:
    branches: [main, "lane/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_lane이 main과의 차이를 본다
      - name: main 브랜치 참조 (레인 소유권 검사용)
        if: github.ref != 'refs/heads/main'
        run: git branch main origin/main || true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: tool/check.sh --full

  android-debug-build:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: dart run tool/merge_arb.dart
      - working-directory: apps/game
        run: flutter build apk --debug
