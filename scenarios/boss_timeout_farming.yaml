# 수용 기준: 보스를 30초 안에 못 잡으면 파밍 모드로 전환된다 (docs/GAME_DESIGN.md 4.1-4, 7.1)
# 담당: battle 레인 (docs/specs/battle-m1-core.md 수용 기준 8).
name: 보스 시간 초과 시 파밍 모드로 전환된다
seed: 42
state: fixtures/states/boss_fight.json
# 편성을 옥토(Lv3) 한 명으로 줄여 확실히 약하게 만든다 (픽스처는 UI 레인도 쓰므로 그대로 둔다).
steps:
  - input: { type: op.setFleet, crewIds: [octo] }
  - expect: { bossActive: true, stage: 5 }
  - advance: 31s
  - expect: { bossActive: false, farming: true, stage: 5 }
  - input: challengeBoss
  - expect: { bossActive: true }
