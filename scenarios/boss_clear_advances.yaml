# 수용 기준: 보스를 제한 시간 안에 잡으면 다음 스테이지로 넘어간다 (docs/specs/battle-m1-core.md 9).
# 젬은 처음 깬 보스만(사용자 신고 '젬 과다', 2026-10-16) — 이 상태는 최고 41이라 스테이지 5 보스는 젬 없음.
# 담당: battle 레인. 강한 편성(stage37_midgame)으로 스테이지 5 보스를 바로 부른다.
# 6초: 보스는 잡고(4초 안), 다음 스테이지 보스(무리 3파 뒤, 10초 이상)는 아직 안 나온 시점.
name: 보스 처치 시 다음 스테이지 (다시 깬 보스는 젬 없음)
seed: 3
state: fixtures/states/stage37_midgame.json
steps:
  - input: { type: op.jumpStage, stage: 5 }
  - input: op.spawnBoss
  - expect: { bossActive: true, stage: 5, gems: 140 }
  - advance: 6s
  - expect: { farming: false, stage: 6, gems: 160 }  # 처치 후 다음 스테이지 무리가 이미 진행 중일 수 있다. 보스 젬은 없고 +20 = 도감 첫 처치(픽스처 도감이 비어 있음, 잡몹 3 + 보스 1) × 5 — 초반 무리가 커져(피드백 #4) 6초 안 첫 처치 종류가 하나 줄었다
