# 수용 기준: 보스를 제한 시간 안에 잡으면 다음 스테이지로 넘어가고 젬을 받는다 (docs/specs/battle-m1-core.md 9)
# 담당: battle 레인. 강한 편성(stage37_midgame)으로 스테이지 5 보스를 바로 부른다.
name: 보스 처치 시 다음 스테이지 + 젬
seed: 3
state: fixtures/states/stage37_midgame.json
steps:
  - input: { type: op.jumpStage, stage: 5 }
  - input: op.spawnBoss
  - expect: { bossActive: true, stage: 5, gems: 140 }
  - advance: 20s
  - expect: { farming: false, stage: 6, gems: 145 }  # 처치 후 다음 스테이지 무리가 이미 진행 중일 수 있다
