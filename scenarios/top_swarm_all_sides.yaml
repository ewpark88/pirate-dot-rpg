name: 탑다운 — 사방 무리 처치로 진행
seed: 11
state: fixtures/states/stage37_midgame.json
steps:
  - input: { type: op.jumpStage, stage: 10 }
  - input: { type: setSetting, key: battleView, value: top }
  - advance: 1t
  - expect: { mode: top, stage: 10, wave: 0, quadrants: 3 }
  - advance: 40s
  - expect: { mode: top, stage: 11 }
