# 수용 기준: 탑다운 보스는 위쪽 화면 밖에서 나와 배 중심 standoff 원(waves.top.bossStandoff)에 서서 원을 돌고,
# 원 안으로 들어오지 않는다(밀려도 standoff + 20 안). 제한 시간이 지나면 옆모습과 같이 파밍 (탑다운 전환 T1).
# 담당: battle(T1 S5). 약한 편성(new_player)으로 스테이지 30 보스를 불러 시간 안에 못 잡게 하고, 배는 무적(침몰로 끝나지 않게).
name: 탑다운 — 보스 원 둘레 정지
seed: 2
state: fixtures/states/new_player.json
steps:
  - input: { type: setSetting, key: battleView, value: top }
  - input: { type: op.jumpStage, stage: 30 }
  - input: { type: op.invincible, on: true }
  - input: op.spawnBoss
  - expect: { mode: top, bossActive: true, bossAtStandoff: false }
  - advance: 15s
  - expect: { bossActive: true, bossAtStandoff: true }
  - advance: 16s
  - expect: { bossActive: false, farming: true, stage: 30 }
