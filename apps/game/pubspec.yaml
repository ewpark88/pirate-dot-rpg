name: pirate_dot
description: 해적도트 원정대 — 도트 방치형 RPG (Flutter + Flame).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  firebase_analytics: 12.6.0
  firebase_core: 4.15.0
  firebase_crashlytics: 5.4.0
  flame: ^1.38.2
  flame_audio: 2.12.2
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  game_core: any
  game_data: any
  google_mobile_ads: 9.1.0
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  # 도트 팩 v0.2 (tools/art/import_pack.py가 채움, 라이선스는 assets/LICENSES.json)
  assets:
    - assets/crews/
    - assets/fx/
    - assets/enemies/
    - assets/bosses/
    - assets/ship/
    - assets/projectiles/
    - assets/coin.png
    - assets/ui/
    - assets/weapons/
    - assets/fx/pb/
    - assets/crew_art/
    - assets/ui/cards/
    - assets/audio/sfx/
    - assets/audio/bgm/
    - assets/fonts/Galmuri-OFL.txt
    - assets/fonts/Jua-OFL.txt
    - assets/fonts/GowunDodum-OFL.txt
  # 한글 도트 폰트 (OFL-1.1, assets/fonts/Galmuri-OFL.txt 원문 동봉)
  fonts:
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700
    # 스킨 r1 글꼴 (OFL-1.1, 원문 동봉) — 사용자 승인 2026-10-15
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: GowunDodumSymbols
      fonts:
        - asset: assets/fonts/GowunDodumSymbols.ttf
